<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bản Đồ - Google Maps Clone</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <path
            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
            fill="#4285F4"
          />
        </svg>
        <span>Maps</span>
      </div>
      <div class="search-container">
        <input
          type="text"
          id="searchInput"
          placeholder="Tìm kiếm địa điểm..."
          autocomplete="off"
        />
        <button id="searchBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#5f6368">
            <path
              d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
            />
          </svg>
        </button>
        <div class="search-suggestions" id="searchSuggestions"></div>
      </div>
      <div class="header-buttons">
        <button class="icon-btn" id="directionsBtn" title="Chỉ đường">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#5f6368">
            <path
              d="M21.71 11.29l-9-9c-.39-.39-1.02-.39-1.41 0l-9 9c-.39.39-.39 1.02 0 1.41l9 9c.39.39 1.02.39 1.41 0l9-9c.39-.38.39-1.01 0-1.41zM14 14.5V12h-4v3H8v-4c0-.55.45-1 1-1h5V7.5l3.5 3.5-3.5 3.5z"
            />
          </svg>
        </button>
        <button class="icon-btn" id="saveBtn" title="Đã lưu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#5f6368">
            <path
              d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"
            />
          </svg>
        </button>
        <button class="icon-btn" id="menuBtn" title="Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#5f6368">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3>Địa điểm gần đây</h3>
        <button id="closeSidebar">×</button>
      </div>
      <div class="sidebar-content" id="sidebarContent">
        <div class="location-item">
          <div class="location-icon">📍</div>
          <div class="location-info">
            <h4>Vị trí của bạn</h4>
            <p>Nhấn để xem vị trí hiện tại</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Controls -->
    <div class="map-controls">
      <button class="control-btn" id="locateBtn" title="Vị trí của tôi">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#5f6368">
          <path
            d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"
          />
        </svg>
      </button>
      <div class="zoom-controls">
        <button class="control-btn" id="zoomInBtn">+</button>
        <button class="control-btn" id="zoomOutBtn">−</button>
      </div>
      <button class="control-btn" id="layersBtn" title="Lớp bản đồ">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#5f6368">
          <path
            d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"
          />
        </svg>
      </button>
      <button class="control-btn" id="streetViewBtn" title="Street View">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#5f6368">
          <path
            d="M12 2C8.14 2 5 5.14 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.86-3.14-7-7-7zm0 2c1.1 0 2 .9 2 2 0 1.11-.9 2-2 2s-2-.89-2-2c0-1.1.9-2 2-2zm0 10c-1.67 0-3.14-.85-4-2.15.02-1.32 2.67-2.05 4-2.05s3.98.73 4 2.05c-.86 1.3-2.33 2.15-4 2.15z"
          />
        </svg>
      </button>
    </div>

    <!-- Layer Selector -->
    <div class="layer-selector" id="layerSelector">
      <div class="layer-option" data-layer="street">
        <img src="https://mt1.google.com/vt/lyrs=m&x=0&y=0&z=1" alt="Street" />
        <span>Bản đồ</span>
      </div>
      <div class="layer-option" data-layer="satellite">
        <img
          src="https://mt1.google.com/vt/lyrs=s&x=0&y=0&z=1"
          alt="Satellite"
        />
        <span>Vệ tinh</span>
      </div>
      <div class="layer-option" data-layer="terrain">
        <img src="https://mt1.google.com/vt/lyrs=p&x=0&y=0&z=1" alt="Terrain" />
        <span>Địa hình</span>
      </div>
    </div>

    <!-- Info Panel -->
    <div class="info-panel" id="infoPanel">
      <button class="close-btn" id="closeInfo">×</button>
      <div id="infoPanelContent">
        <h3>Thông tin địa điểm</h3>
        <p>Nhấn vào bản đồ để xem thông tin chi tiết</p>
      </div>
    </div>

    <!-- Directions Panel -->
    <div class="directions-panel" id="directionsPanel">
      <div class="directions-header">
        <h3>Chỉ đường</h3>
        <button class="close-btn" id="closeDirections">×</button>
      </div>
      <div class="directions-inputs">
        <div class="direction-input-group">
          <div class="input-icon">🔵</div>
          <input
            type="text"
            id="startPoint"
            placeholder="Chọn điểm xuất phát..."
            autocomplete="off"
          />
          <button
            class="current-location-btn"
            id="useCurrentLocation"
            title="Sử dụng vị trí hiện tại"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#1a73e8">
              <path
                d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"
              />
            </svg>
          </button>
        </div>
        <div class="direction-input-group">
          <div class="input-icon">🔴</div>
          <input
            type="text"
            id="endPoint"
            placeholder="Chọn điểm đến..."
            autocomplete="off"
          />
        </div>
        <div class="transport-modes">
          <button class="mode-btn active" data-mode="car" title="Ô tô">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"
              />
            </svg>
          </button>
          <button class="mode-btn" data-mode="bike" title="Xe đạp">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M15.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM5 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5zm5.8-10l2.4-2.4.8.8c1.3 1.3 3 2.1 5.1 2.1V9c-1.5 0-2.7-.6-3.6-1.5l-1.9-1.9c-.5-.4-1-.6-1.6-.6s-1.1.2-1.4.6L7.8 8.4c-.4.4-.6.9-.6 1.4 0 .6.2 1.1.6 1.4L11 14v5h2v-6.2l-2.2-2.3zM19 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z"
              />
            </svg>
          </button>
          <button class="mode-btn" data-mode="walk" title="Đi bộ">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="directions-results" id="directionsResults"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
  </body>
</html>
